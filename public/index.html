<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мой чат-сервис</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; }
  #chat { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
  .msg { margin: 8px 0; }
  .user { color: #0066cc; }
  .bot { color: #333; }
  #input { width: 80%; padding: 8px; }
  #send { padding: 8px 16px; }
</style>
</head>
<body>
<h2>Мой чат-сервис</h2>
<div id="chat"></div>
<input id="input" type="text" placeholder="Напишите сообщение...">
<button id="send">Отправить</button>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  chat.innerHTML += <div class="msg user"><b>Вы:</b> ${text}</div>;
  input.value = '';
  chat.scrollTop = chat.scrollHeight;

  const response = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text })
  });
  const data = await response.json();

  chat.innerHTML += <div class="msg bot"><b>Ассистент:</b> ${data.reply}</div>;
  chat.scrollTop = chat.scrollHeight;
}

sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
