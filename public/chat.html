<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой чат-сервис</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #f0f4f8 0%, #d9e4f0 100%);
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 700px;
    height: 90vh;
    max-height: 800px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    color: white;
    padding: 20px 24px;
    font-size: 20px;
    font-weight: 600;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.4;
    word-wrap: break-word;
    animation: fadeIn 0.3s ease-in;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .user {
    align-self: flex-end;
    background: #6366f1;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .bot {
    align-self: flex-start;
    background: #f1f5f9;
    color: #1e293b;
    border-bottom-left-radius: 4px;
  }
  .bot.loading {
    background: #e8edf4;
    color: #64748b;
    font-style: italic;
  }
  .input-area {
    display: flex;
    padding: 16px;
    gap: 10px;
    border-top: 1px solid #e2e8f0;
  }
  #input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #cbd5e1;
    border-radius: 24px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  #input:focus { border-color: #6366f1; }
  #input:disabled {
    background: #f1f5f9;
    cursor: not-allowed;
  }
  #send {
    padding: 12px 24px;
    background: #6366f1;
    color: white;
    border: none;
    border-radius: 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
  }
  #send:hover:not(:disabled) { background: #4f46e5; }
  #send:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .error-msg {
    background: #fee2e2 !important;
    color: #991b1b !important;
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">Мой чат-сервис</div>
  <div id="chat"></div>
  <div class="input-area">
    <input id="input" type="text" placeholder="Напишите сообщение...">
    <button id="send">Отправить</button>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

// Функция для безопасной вставки текста (защита от XSS)
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Функция для создания сообщения
function createMessage(text, className) {
  const msg = document.createElement('div');
  msg.className = `msg ${className}`;
  msg.textContent = text;
  return msg;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  // Блокируем интерфейс во время отправки
  input.disabled = true;
  sendBtn.disabled = true;

  // Добавляем сообщение пользователя
  const userMsg = createMessage(text, 'user');
  chat.appendChild(userMsg);
  
  input.value = '';
  chat.scrollTop = chat.scrollHeight;

  // Добавляем индикатор загрузки
  const loadingMsg = createMessage('⏳ Думаю...', 'bot loading');
  chat.appendChild(loadingMsg);
  chat.scrollTop = chat.scrollHeight;

  try {
    // Отправляем запрос к серверу
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });

    // Проверяем статус ответа
    if (!response.ok) {
      throw new Error(`Ошибка сервера: ${response.status}`);
    }

    const data = await response.json();

    // Проверяем наличие ответа
    const reply = data.reply || 'Извините, я не понял ваш запрос.';
    
    // Заменяем индикатор загрузки на ответ бота
    loadingMsg.className = 'msg bot';
    loadingMsg.textContent = reply;

  } catch (error) {
    console.error('Ошибка при отправке:', error);
    
    // Показываем сообщение об ошибке
    loadingMsg.className = 'msg bot error-msg';
    loadingMsg.textContent = '❌ Ошибка соединения. Проверьте интернет и попробуйте снова.';
  } finally {
    // Разблокируем интерфейс
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
    chat.scrollTop = chat.scrollHeight;
  }
}

// Обработчики событий
sendBtn.addEventListener('click', sendMessage);

input.addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Приветственное сообщение при загрузке
window.addEventListener('DOMContentLoaded', () => {
  const welcomeMsg = createMessage('👋 Здравствуйте! Чем я могу вам помочь?', 'bot');
  chat.appendChild(welcomeMsg);
});
</script>
</body>
</html>
