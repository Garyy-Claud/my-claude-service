<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вход</title>
<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #f0f4f8 0%, #d9e4f0 100%);
    height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box {
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    width: 320px;
  }
  h2 { margin-top: 0; color: #1e293b; }
  input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
    box-sizing: border-box;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #6366f1;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  button:hover { background: #4f46e5; }
  #error { color: #dc2626; font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
<div class="box">
  <h2>Вход для администратора</h2>
  <input id="username" type="text" placeholder="Логин">
  <input id="password" type="password" placeholder="Пароль">
  <button id="loginBtn">Войти</button>
  <div id="error"></div>
</div>

<script>
document.getElementById('loginBtn').addEventListener('click', async () => {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;

  const response = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });
  const data = await response.json();

  if (data.success) {
    window.location.href = '/';
  } else {
    document.getElementById('error').textContent = 'Неверный логин или пароль';
  }
});
</script>
</body>
</html>
